[project]
name = "creditbridge-backend"
version = "0.1.0"
description = "CreditBridge — AI Credit Intelligence Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "groq>=0.9.0",
    "python-dotenv>=1.0.1",
    "supabase>=2.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
